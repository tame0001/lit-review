<mat-toolbar class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a class="site-logo" routerLink="/">
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">menu_book</mat-icon>
        <span>Lit Review Cockpit</span>
      </a>

      <nav class="site-nav" aria-label="Primary">
        <ul class="site-menu">
          <li>
            <a
              matButton="text"
              routerLink="/"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
            >
              Reading Queue
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="header-actions">
      @if (health(); as h) {
        <span
          class="status-badge"
          [class.is-online]="h.zotero_local_available"
          [title]="'Zotero mode: ' + h.zotero_mode"
        >
          Zotero: {{ h.zotero_local_available ? 'Localhost' : h.zotero_mode }}
        </span>
      } @else {
        <span class="status-badge is-offline">API Offline</span>
      }

      <button
        matButton="filled"
        type="button"
        [disabled]="syncing()"
        (click)="triggerSync()"
      >
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">sync</mat-icon>
        <span>{{ syncing() ? 'Syncing...' : 'Sync Now' }}</span>
      </button>
    </div>
  </div>
</mat-toolbar>

<main class="main-shell">
  <router-outlet />
</main>
