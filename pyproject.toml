[project]
name = "lit-review"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.*",
    "httpx2==2.16.*",
    "keyring==25.*",
    "pypdf==7.1.*",
    "python-frontmatter==1.3.*",
    "pyzotero==1.16.*",
    "uvicorn==0.54.*",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["backend"]
typeCheckingMode = "standard"
